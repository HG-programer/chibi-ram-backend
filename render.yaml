services:
  - type: web
    name: chibi-ram-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python chibi_ram_backend.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_RAM_MODEL_ID
        sync: false
      - key: CHAT_API_TOKEN
        sync: false
